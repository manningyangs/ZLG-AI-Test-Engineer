[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlg-ai-test-engine"
version = "0.3.0"
description = "ZLG AI Test Engineer - AI automotive bus test engineering assistant (Windows desktop)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "jsonschema>=4.21",
    "keyring>=24.0",
    "PySide6>=6.6",
    # cantools: 成熟 DBC/CAN 数据库工具（MIT 许可，pypi: cantools）；
    # 用途：DBC 解析底层实现，输出仍转换为本项目 NetworkModel（不暴露三方对象）
    "cantools>=39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
zlg-ai-test-engineer = "zlg_ai_test_engine.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zlg_ai_test_engine = ["plugins/*.json", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
